name: Deploy server

# Deploys the Cloudflare Worker (server/) and keeps its D1 database in step:
# creates the database on the first run, applies migrations and reloads the
# campaign and the multiplayer puzzle bank. Runs on demand (Actions → Deploy
# server → Run workflow) and when server/ or the campaign changes on the
# default branch.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (docs/DISTRIBUTION.md §5). Without them it skips.

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'app/assets/campaign/**'
      - '.github/workflows/deploy-server.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet; skipping deploy (docs/DISTRIBUTION.md §5)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install and test
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Find or create the D1 database
        if: steps.secrets.outputs.ready == 'true'
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let d = ""; process.stdin.on("data", c => d += c).on("end", () => {
                const db = JSON.parse(d).find(b => b.name === "wordsmith");
                console.log(db ? db.uuid : "");
              });'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create wordsmith
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the wordsmith D1 database"; exit 1; }
          # The repo keeps a placeholder id; fill in the real one for this run.
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          # And where this repository's releases are, for the APK downloads.
          sed -i "s#{repository}#${GITHUB_REPOSITORY}#" wrangler.jsonc
          if grep -q '{repository}' wrangler.jsonc; then echo "::error::APK_SOURCE_URL still has {repository}"; exit 1; fi
          echo "D1 database: $id"

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply wordsmith --remote

      - name: Load the campaign
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm run db:campaign
          npx wrangler d1 execute wordsmith --remote --file data/campaign.sql --yes

      - name: Load the multiplayer puzzle bank
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm run db:bank
          npx wrangler d1 execute wordsmith --remote --file data/bank.sql --yes

      - name: Deploy the Worker
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -n "$url" ]; then
            {
              echo "### Server deployed"
              echo ""
              echo "URL: $url"
              echo ""
              echo "The app has this URL built in (app/lib/net/config.dart); the optional variable \`API_BASE_URL\` overrides it."
            } >> "$GITHUB_STEP_SUMMARY"
            # A brand-new workers.dev address can take a minute to answer.
            for i in $(seq 1 18); do
              if curl -fsS "$url/v1/health"; then echo; exit 0; fi
              sleep 10
            done
            echo "::error::$url/v1/health did not answer within 3 minutes"
            exit 1
          fi

      - name: Set the LiveKit secrets (video chat)
        if: steps.secrets.outputs.ready == 'true'
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          if [ -z "$LIVEKIT_URL" ] || [ -z "$LIVEKIT_API_KEY" ] || [ -z "$LIVEKIT_API_SECRET" ]; then
            echo "::notice::LiveKit secrets are not set, so video chat stays off (docs/DISTRIBUTION.md §5)."
            exit 0
          fi
          node -e 'const e = process.env; process.stdout.write(JSON.stringify({ LIVEKIT_URL: e.LIVEKIT_URL, LIVEKIT_API_KEY: e.LIVEKIT_API_KEY, LIVEKIT_API_SECRET: e.LIVEKIT_API_SECRET }))' > "$RUNNER_TEMP/livekit.json"
          npx wrangler secret bulk "$RUNNER_TEMP/livekit.json"
          rm -f "$RUNNER_TEMP/livekit.json"
          echo "Video chat: LiveKit secrets set." >> "$GITHUB_STEP_SUMMARY"

      - name: Set the FCM secret (invite notifications)
        if: steps.secrets.outputs.ready == 'true'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::notice::The FCM_SERVICE_ACCOUNT secret is not set, so invite notifications stay off (docs/DISTRIBUTION.md §5)."
            exit 0
          fi
          node -e 'const e = process.env; process.stdout.write(JSON.stringify({ FCM_SERVICE_ACCOUNT: e.FCM_SERVICE_ACCOUNT }))' > "$RUNNER_TEMP/fcm.json"
          npx wrangler secret bulk "$RUNNER_TEMP/fcm.json"
          rm -f "$RUNNER_TEMP/fcm.json"
          echo "Invite notifications: FCM secret set." >> "$GITHUB_STEP_SUMMARY"

      - name: Set the Resend secrets (contact form emails)
        if: steps.secrets.outputs.ready == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$CONTACT_EMAIL" ]; then
            echo "::notice::The RESEND_API_KEY and CONTACT_EMAIL secrets are not set, so contact form messages are only kept in D1 (docs/DISTRIBUTION.md §5)."
            exit 0
          fi
          node -e 'const e = process.env; process.stdout.write(JSON.stringify({ RESEND_API_KEY: e.RESEND_API_KEY, CONTACT_EMAIL: e.CONTACT_EMAIL }))' > "$RUNNER_TEMP/resend.json"
          npx wrangler secret bulk "$RUNNER_TEMP/resend.json"
          rm -f "$RUNNER_TEMP/resend.json"
          echo "Contact form: Resend secrets set." >> "$GITHUB_STEP_SUMMARY"
