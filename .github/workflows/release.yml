name: Release (friends build)

# Tag a version (git tag v0.1.0 && git push --tags) to build a signed APK and
# send it to the "friends" group in Firebase App Distribution.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD  – release signing key (required)
#   FIREBASE_SERVICE_ACCOUNT – JSON key of a service account with the
#                              "Firebase App Distribution Admin" role
#   FIREBASE_ANDROID_APP_ID  – e.g. 1:1234567890:android:abc123…
# The last two are optional: without them the APK is only kept as a workflow
# artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check the tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"; exit 1
          fi

      - name: Install the signing key
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/DISTRIBUTION.md"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KS_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test
      # Phones only (32- and 64-bit ARM); x86_64 is just for emulators.
      - run: flutter build apk --release --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Send to friends (Firebase App Distribution)
        if: env.FIREBASE_SA != '' && env.FIREBASE_APP_ID != ''
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools appdistribution:distribute \
              build/app/outputs/flutter-apk/app-release.apk \
              --app "$FIREBASE_APP_ID" \
              --groups friends \
              --release-notes "Wordsmith ${GITHUB_REF_NAME}"

      - name: Remove the signing key
        if: always()
        run: rm -f android/app/upload.jks android/key.properties "$RUNNER_TEMP/firebase-sa.json"
