name: Release (friends build)

# Tag a version (bump `version:` in app/pubspec.yaml, then
# git tag v0.1.0 && git push --tags) to build a signed APK and attach it to a
# GitHub Release. Download it from the repo's Releases page and send it to
# friends. Running the workflow by hand builds the same APK as a workflow
# artifact instead.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD  – release signing key (required)
#   FIREBASE_ANDROID_API_KEY – "current_key" from google-services.json
#                              (required for tagged releases: accounts need it)
# Optional repository variable API_BASE_URL overrides the server URL built
# into app/lib/net/config.dart.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
      API_BASE: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check the tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"; exit 1
          fi

      - name: Check online settings
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::error::FIREBASE_ANDROID_API_KEY is not set, so this build would have no accounts; see docs/DISTRIBUTION.md"; exit 1
          fi

      - name: Install the signing key
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/DISTRIBUTION.md"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KS_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      # Phones only (32- and 64-bit ARM); x86_64 is just for emulators.
      - name: Build the APK
        run: |
          defines=(--dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY")
          # An empty define would override the built-in server URL.
          if [ -n "$API_BASE" ]; then defines+=(--dart-define=API_BASE="$API_BASE"); fi
          flutter build apk --release --target-platform android-arm,android-arm64 "${defines[@]}"
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "wordsmith-$version.apk"
          echo "APK=wordsmith-$version.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: wordsmith-release-apk
          path: app/${{ env.APK }}
          retention-days: 30

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Wordsmith ${GITHUB_REF_NAME#v}" \
            --notes "Download **$APK** on your phone and open it to install. Updates install over the previous version."

      - name: Remove the signing key
        if: always()
        run: rm -f android/app/upload.jks android/key.properties
